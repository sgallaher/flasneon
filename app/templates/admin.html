{% extends "base.html" %}

{% block content %}
<h2>Admin Dashboard</h2>

<table border="1">
<tr>
<th>User</th>
<th>Login Time</th>
<th>Logout Time</th>
<th>IP Address</th>
<th>User Agent</th>
</tr>

{% for log in logs %}
<tr>
<td>{{ log.user.username }}</td>
<td>{{ log.login_time }}</td>
<td>{{ log.logout_time or "Still logged in" }}</td>
<td>{{ log.ip_address }}</td>
<td>{{ log.user_agent }}</td>
</tr>
{% endfor %}
</table>

{% endblock %}
